services:
  api:
    image: ghcr.io/karabayogo/openclaw-honcho:latest
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
    - CACHE_URL=redis://redis:6379/0?suppress=true
    env_file:
    - path: .env
      required: false
  deriver:
    image: ghcr.io/karabayogo/openclaw-honcho:latest
    restart: always
    entrypoint:
    - /app/.venv/bin/python
    - -m
    - src.deriver
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@database:5432/postgres
    - CACHE_URL=redis://redis:6379/0?suppress=true
    - METRICS_ENABLED=true
    healthcheck:
      disable: true
    env_file:
    - path: .env
      required: false
  database:
    image: pgvector/pgvector:pg15
    restart: always
    ports:
    - 127.0.0.1:5432:5432
    command:
    - postgres
    - -c
    - max_connections=800
    environment:
    - POSTGRES_DB=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_HOST_AUTH_METHOD=trust
    - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
    - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    - pgdata:/var/lib/postgresql/data/
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:8.2
    restart: always
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - ./redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata: null
  prometheus-data: null
